Gaonu Horse Pastures note = 北地骑兵｜向城池所属势力提供1单位战马资源；本城训练骑乘单位时获得25%生产力加成。战马为可用资源容量，并非每回合累积或直接赠送骑兵。
City feature rules = 城池特色｜仅在v1.4.0及之后的战役新开局中预设，每座城一处。不可建造、购买或出售，攻城时保留并由新主人接管。城市基础产出受占领抵抗、傀儡和常规修正影响；不是重复攻城领取的一次性奖励。城池特色为玩法设计，不是史实建筑复原。
City Sites Briefing = 城邑军情
City sites briefing text = 城邑军情 · 七城各有所长\n\n南郑府库：军费与生产。\n沔县栈道驿：粮食与后方生产。\n陈仓转运营：城内及周边休整，陆军额外回血。\n郿县关防：额外城防与生命。\n废丘武库：生产与新兵经验。\n栎阳粮市：粮食与金币。\n高奴马苑：战马资源与骑兵生产。\n\n特色随城池归属转交。夺城之后，还须保住收益。详细数值可在城内建筑与文明百科查看。
City sites briefing accept = 军情已明，依势进军

