HZ council rules = 中途军议｜玩家势力可召开初阵、进退、决胜三次军议。阶段一在第8回合或首次夺城时开启；阶段二、三可在第20、35回合开启，也可在完成上次军议后再次夺城时提前开启。每阶段只取一策，已领取的奖励不会因夺城或重载重复发放。付费方案要求足额金币，援军均为普通部队。AI势力不自动获得这三次额外军议。

Vanguard General = 先登名将
Veteran General = 中坚名将
Pass General = 守关名将

# v1.6.0 mountain passes and supply routes
Qinling Main Pass = 秦岭关
Qinling Main Pass note = 主路关隘｜位于南郑至郿县的有路通道，坐标(-3,2)。驻守本格额外获得35%地块防御加成；开局由雍军一队长矛兵把守。关隘不可另造、劫掠或拆除，击退守军后双方均可据守。加成不随离开关隘带走，远程攻城器械仍须步兵掩护。
Western Mountain Pass = 西岭隘
Western Mountain Pass note = 西路隘口｜位于沔县至陈仓的丘陵通道，坐标(6,-7)。驻守本格额外获得15%地块防御加成，与原有丘陵防御叠加。开局没有额外守军，适合抢占侧路；沿线山地与缺少连续道路仍会拖慢行军。关隘不可另造、劫掠或拆除。
Campaign Supply Station = 粮道驿站
Campaign Supply Station note = 就地补给｜双方陆地单位在完整驿站本格正常休整时，额外恢复10生命；从完整驿站开始本方回合时，移动力+1。移动经过不会返还行动点，已经行动也不会自动回血。驿站不向周边散发补给，须实际驻入本格；军事占位与护送工人因此都有价值。可被劫掠，劫掠后两项补给效果停用；工人可在非敌对领土执行“修复”恢复驿站；若已处敌方领土，须先夺取其所属城池。不能新造，自动工人不会覆盖；手动改建其他设施会拆除驿站。
Campaign route rules = 关隘与粮道｜v1.6.0新开局和地形地图预设两处关隘、四处粮道驿站。主路南道驿(-7,-3)、北道驿(-1,4)；西路栈道南驿(3,-10)、栈道北驿(8,-2)。关隘依靠占位控制，驿站依靠驻入本格享受补给，双方适用；不会因经过据点、反复夺城或重载存档领取一次性礼包。完整驿站的移动加成以回合开始时为准，离站后不会逐格补回行动点。
Campaign Routes Briefing = 军道图志
Campaign Routes Title = 关 山 粮 道 · 两 路 出 秦
Campaign Routes Briefing text = 秦岭关有雍军长矛兵把守，主路道路较好；西岭隘开局无人据守，但沿线丘陵行军较慢。\n\n完整粮道驿站：本格正常休整恢复+10生命，从本格开始回合时移动+1。双方都能使用；驿站被劫掠后停用，须护送工人修复。\n\n占关可守路，驻驿可整军。地图上的关楼与粮仓图标、地块信息及文明百科可查看详情。
Campaign Routes Briefing accept = 军道已明，择路进军
South Road Station = 南道驿
South Road Station note = 主路南段｜坐标(-7,-3)，南郑北侧的道路驿站，是汉军进入秦岭前的整备点。驻站效果与修复规则见下。
North Road Station = 北道驿
North Road Station note = 主路北段｜坐标(-1,4)，秦岭关以北、郿县以南。越关之后可先驻站休整，再向郿县推进。驻站效果与修复规则见下。
Southern Plank Station = 栈道南驿
Southern Plank Station note = 西路南段｜坐标(3,-10)，沔县通向西侧山路的入口。适合整备侧路部队与护送工人。驻站效果与修复规则见下。
Northern Plank Station = 栈道北驿
Northern Plank Station note = 西路北段｜坐标(8,-2)，西侧山路出口、陈仓南侧。争取在出山后保有一处休整落脚点。驻站效果与修复规则见下。