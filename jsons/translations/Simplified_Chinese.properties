# v1.3.0 historical general units
Han Xin - Commander = 韩信·大将军
Han Xin - Commander role = 统军｜移动3。为2格内己方陆军提供15%战斗力；与原生大军事家光环取最高值，不叠加。文职单位，可与己方军队同格；不能攻击或占城，须有军队保护。被敌军接触时阵亡，不会投敌。
Han Xin - Commander history = 韩信在汉中受拜大将，参与谋划北定三秦。本单位以统军支援为设计重点，数值与部署均为游戏化改编。
Fan Kuai - Vanguard = 樊哙·先登
Fan Kuai - Vanguard role = 先登｜战力16，移动2。攻击城市时战斗力提升25%；可占领城市。仍会受到反击，宜在强弩削弱城防后投入。
Fan Kuai - Vanguard history = 樊哙随刘邦入汉中，并在还定三秦过程中攻城陷阵。本单位以先登攻坚为设计重点，不代表个人能够独自攻陷关城。
Cao Can - Veteran = 曹参·中坚
Cao Can - Veteran role = 中坚｜战力15，移动2。防御时战斗力提升15%；正常休整时额外恢复10生命。并非行动后自动回血，适合固守侧翼与轮换休整。
Cao Can - Veteran history = 曹参随汉军还定三秦，参与多次作战。本单位以持重续战为游戏化定位，并非史料中的固有技能。
Zhang Han - Defender = 章邯·守关
Zhang Han - Defender role = 守关｜雍国主将，战力16，移动2。防御时战斗力提升20%；由正常AI控制，可能离开起始位置。击败此单位不会自动消灭雍国，仍须完成夺城目标。
Zhang Han - Defender history = 章邯受封雍王，与汉军争夺关中。本单位放在郿县方向以构成守关压力，具体驻地是地图玩法安排。
Historical general rules = 战役名将｜仅由名将战役开局配置，每人1名；不可生产、购买或升级为其他兵种。阵亡后不再补充。普通军议不会复制名将；名将的战斗单位代表其亲军。
HZ Orders = 军令：保住南郑，夺取废丘、栎阳、高奴三座原始都城，还定三秦。东北大道较近，西北山路可争陈仓。韩信统军，樊哙攻坚，曹参护翼；雍将章邯扼守北路。汉与三秦持续交战；未知地形须由部队侦察。

# v1.4.0 city features
